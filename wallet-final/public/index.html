<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#10B981" />

    <!-- Open Graph / partage sur réseaux sociaux (URLs absolues obligatoires
         pour que la vignette s'affiche dans WhatsApp / Discord / iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexiaWallet" />
    <meta property="og:url" content="https://nexiawallet.com" />
    <meta property="og:title" content="NexiaWallet — Tes cryptos, simplement." />
    <meta property="og:description" content="Portefeuille crypto non-custodial : achète, envoie et échange sur 8 réseaux (Ethereum, Bitcoin, Solana…). Tes clés restent sur ton téléphone." />
    <meta property="og:image" content="https://nexiawallet.com/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexiaWallet — Tes cryptos, simplement." />
    <meta name="twitter:description" content="Portefeuille crypto non-custodial : tes clés privées ne quittent jamais ton appareil." />
    <meta name="twitter:image" content="https://nexiawallet.com/icon.png" />

    <!-- Mesure d'audience Umami (sans cookie) : nombre de visiteurs, y compris
         en temps réel pendant le lancement Product Hunt. data-domains limite le
         comptage au vrai domaine, pour que les builds locaux et les tests e2e
         ne faussent pas les statistiques. data-exclude-search retire les
         paramètres d'URL : un lien partagé qui contiendrait une adresse de
         wallet (demande de paiement, parrainage) n'arrive jamais chez Umami. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="bab64506-68c1-48b4-aaf8-f922027da76a" data-domains="nexiawallet.com,www.nexiawallet.com" data-exclude-search="true"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Polices de la refonte graphique (design "banque privée") -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Écran de chargement affiché INSTANTANÉMENT (HTML/CSS purs, aucune
         dépendance JS/police). Le bundle Expo web pèse ~1,8 Mo : sans ça, un
         visiteur mobile voit une page blanche pendant plusieurs secondes et
         croit que le lien est cassé. React remplace le contenu de #root au
         montage, donc ce bloc disparaît tout seul. -->
    <style>
      #nx-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        transition: opacity .35s ease;
      }
      #nx-splash .nx-mark {
        width: 64px; height: 64px; border-radius: 18px;
        background: #10B981;
        display: flex; align-items: center; justify-content: center;
        font-size: 34px;
        box-shadow: 0 12px 30px rgba(16,185,129,.28);
      }
      #nx-splash .nx-name {
        margin-top: 18px; font-size: 20px; font-weight: 800; color: #0B1215; letter-spacing: .2px;
      }
      #nx-splash .nx-sub { margin-top: 6px; font-size: 13px; color: #5B6672; }
      #nx-splash .nx-bar {
        margin-top: 22px; width: 132px; height: 4px; border-radius: 4px;
        background: #EAF2EF; overflow: hidden;
      }
      #nx-splash .nx-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
        background: #10B981; animation: nx-slide 1.1s infinite ease-in-out;
      }
      @keyframes nx-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="nx-splash">
        <div class="nx-mark">🛡️</div>
        <div class="nx-name">NexiaWallet</div>
        <div class="nx-sub">Chargement…</div>
        <div class="nx-bar"></div>
      </div>
    </div>
  </body>
</html>
